  <!-- APP LOGIC -->
  <script>
    let selectedCategory = "All Items";
    let selectedVariants = {}; // itemId -> variantIndex
    let cart = []; // { key, id, name, size, price, qty }
    let appliedCode = null;
    let orderType = "Home Delivery";

    // Initialize Cafe Info
    document.getElementById("cafeTitle").innerText = CAFE_CONFIG.name;
    document.getElementById("cafeAddress").innerText = CAFE_CONFIG.address;
    document.getElementById("footerAddress").innerText = CAFE_CONFIG.address;
    document.getElementById("phoneDisplay").innerText = CAFE_CONFIG.phone;
    document.getElementById("footerPhone").innerText = CAFE_CONFIG.phone;
    document.getElementById("callBtn").href = `tel:${CAFE_CONFIG.phone}`;
    document.getElementById("directWaBtn").href = `https://wa.me/91${CAFE_CONFIG.phone}?text=${encodeURIComponent("Hello Chocogrid Cafe! I want to place an order.")}`;

    if (CAFE_CONFIG.showBanner) {
      document.getElementById("topOfferBanner").classList.remove("hidden");
      document.getElementById("bannerContent").innerHTML = CAFE_CONFIG.bannerText;
    }

    // Set default variants
    MENU_ITEMS.forEach(item => { selectedVariants[item.id] = 0; });

    function renderCategories() {
      const cats = ["All Items", ...new Set(MENU_ITEMS.map(i => i.category))];
      document.getElementById("categoryTabs").innerHTML = cats.map(c => `
        <button onclick="selectCategory('${c}')" class="px-3.5 py-1.5 rounded-full text-xs font-semibold whitespace-nowrap transition ${selectedCategory === c ? 'btn-gold' : 'bg-[#25140c] text-[#d8c3ae] border border-[#d4a359]/25'}">
          ${c}
        </button>
      `).join("");
    }

    function selectCategory(cat) {
      selectedCategory = cat;
      renderCategories();
      renderMenu();
    }

    function selectVariant(itemId, vIdx) {
      selectedVariants[itemId] = vIdx;
      renderMenu();
    }

    function renderMenu() {
      const q = document.getElementById("searchInput").value.toLowerCase();
      const filtered = MENU_ITEMS.filter(item => {
        const matchCat = selectedCategory === "All Items" || item.category === selectedCategory;
        const matchSearch = item.name.toLowerCase().includes(q) || item.desc.toLowerCase().includes(q);
        return matchCat && matchSearch;
      });

      const grouped = {};
      filtered.forEach(item => {
        if (!grouped[item.category]) grouped[item.category] = [];
        grouped[item.category].push(item);
      });

      const container = document.getElementById("menuContainer");
      if (filtered.length === 0) {
        container.innerHTML = `<p class="text-center text-sm text-[#a88c72] py-10">No items matched your search.</p>`;
        return;
      }

      container.innerHTML = Object.keys(grouped).map(cat => `
        <section class="space-y-3">
          <div class="border-b border-[#d4a359]/20 pb-1.5">
            <h2 class="font-brand text-lg font-bold text-[#f3d08a] uppercase">${cat}</h2>
          </div>
          <div class="space-y-3">
            ${grouped[cat].map(item => {
              const vIdx = selectedVariants[item.id] || 0;
              const variant = item.variants[vIdx];
              const cartKey = `${item.id}_${variant.size}`;
              const inCart = cart.find(c => c.key === cartKey);

              return `
                <div class="card-glass rounded-2xl p-4 space-y-3">
                  <div class="flex justify-between items-start gap-2">
                    <div>
                      <h3 class="font-bold text-base text-[#fdf5ec]">${item.name}</h3>
                      <p class="text-xs text-[#bfa68e] mt-0.5">${item.desc}</p>
                    </div>
                    ${item.badge ? `<span class="px-2 py-0.5 rounded-md bg-[#d4a359]/20 border border-[#d4a359]/40 text-[#f3d08a] text-[10px] font-bold whitespace-nowrap">${item.badge}</span>` : ''}
                  </div>

                  <div class="flex flex-wrap gap-2">
                    ${item.variants.map((v, idx) => `
                      <button onclick="selectVariant(${item.id}, ${idx})" class="px-3 py-1 rounded-lg text-xs font-semibold border transition ${vIdx === idx ? 'bg-[#f3d08a] text-[#1a0d06] border-[#f3d08a]' : 'bg-[#1a0d06]/70 text-[#d8c3ae] border-[#d4a359]/30'}">
                        ${v.size} • ₹${v.price}
                      </button>
                    `).join("")}
                  </div>

                  <div class="flex items-center justify-between pt-1">
                    <div>
                      <span class="text-[11px] text-[#a88c72] block">Price</span>
                      <div class="flex items-baseline gap-2">
                        <span class="text-lg font-extrabold text-[#f3d08a]">₹${variant.price}</span>
                        ${variant.oldPrice ? `<span class="text-xs text-[#9e8269] line-through">₹${variant.oldPrice}</span>` : ''}
                        ${variant.oldPrice ? `<span class="text-[10px] font-bold text-emerald-400 bg-emerald-950/80 px-1.5 py-0.5 rounded">SAVE ₹${variant.oldPrice - variant.price}</span>` : ''}
                      </div>
                    </div>

                    ${inCart ? `
                      <div class="flex items-center gap-3 bg-[#f3d08a] text-[#1a0d06] px-3 py-1.5 rounded-xl font-bold text-sm">
                        <button onclick="updateQty('${cartKey}', -1)">−</button>
                        <span>${inCart.qty}</span>
                        <button onclick="updateQty('${cartKey}', 1)">+</button>
                      </div>
                    ` : `
                      <button onclick="addToCart(${item.id})" class="btn-gold px-4 py-2 rounded-xl text-xs flex items-center gap-1">
                        <i class="fa-solid fa-plus"></i> Add
                      </button>
                    `}
                  </div>
                </div>
              `;
            }).join("")}
